<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Todo List</title>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --background-color: #ffffff;
            --text-color: #333333;
            --border-color: #ddd;
            --card-bg: #f9f9f9;
            --button-bg: #4CAF50;
            --button-hover: #45a049;
            --delete-button: #f44336;
            --delete-hover: #da190b;

            --rich-black: #01161eff;
            --midnight-green: #124559ff;
            --air-force-blue: #598392ff;
            --ash-gray: #aec3b0ff;
            --beige: #eff6e0ff;
        }

        .dark-mode {
            --primary-color: #6b8cbc;
            --secondary-color: #4a6fa5;
            --background-color: #1a1a1a;
            --text-color: #f0f0f0;
            --border-color: #444;
            --card-bg: #2d2d2d;
            --button-bg: #4CAF50;
            --button-hover: #45a049;
            --delete-button: #f44336;
            --delete-hover: #da190b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--air-force-blue);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
        }

        .theme-toggle {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .theme-toggle:hover {
            background-color: var(--button-hover);
        }

        .input-container {
            display: flex;
            margin-bottom: 20px;
        }

        #todoInput {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 5px 0 0 5px;
            font-size: 16px;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        #addBtn {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        #addBtn:hover {
            background-color: var(--button-hover);
        }

        ul {
            list-style-type: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background-color: var(--background-color);
            border-radius: 5px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }

        .todo-text {
            flex: 1;
            padding: 0 10px;
            word-break: break-word;
        }

        .completed .todo-text {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background-color: var(--delete-button);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .delete-btn:hover {
            background-color: var(--delete-hover);
        }

        .complete-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 10px;
            transition: background-color 0.3s;
        }

        .complete-btn:hover {
            background-color: #1976D2;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #888;
            font-style: italic;
        }

        .stats {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            color: var(--text-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>jQuery Todo List</h1>
            <button class="theme-toggle" id="themeToggle">Dark Mode</button>
        </header>

        <div class="input-container">
            <input type="text" id="todoInput" placeholder="Add a new task...">
            <button id="addBtn">Add</button>
        </div>

        <ul id="todoList">

        </ul>

        <div class="stats">
            <span>Total: <span id="totalTodos">0</span></span>
            <span>Completed: <span id="completedTodos">0</span></span>
            <span>Pending: <span id="pendingTodos">0</span></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
