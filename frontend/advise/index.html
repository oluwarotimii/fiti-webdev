<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h2 class="card-title">Daily Advice</h2>
                        
                        <div class="countdown-container mb-4">
                            <div class="countdown-circle">
                                <span id="countdown">15</span>
                            </div>
                        </div>
                        
                        <div class="advice-container mb-4">
                            <p id="advice" class="lead">Loading advice...</p>
                        </div>
                        
                        <button id="refresh-btn" class="btn btn-primary">
                            Get New Advice
                        </button>
                        <p class="mt-2">Next advice in: <span id="counter">15</span>s</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
