<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .profile-card {
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background-color: #fff;
      text-align: center;
      padding: 25px;
    }
    .profile-card img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    .profile-card .btn {
      margin: 5px;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="https://mediaproxy.tvtropes.org/width/1200/https://static.tvtropes.org/pmwiki/pub/images/tony_stark.png" alt="Profile Picture">
    <h4 class="mt-2">Tony Stark</h4>
    <p class="text-muted mb-3">Web Developer</p>
    <p class="mb-4">
      Passionate about building software solutions that make everyday tasks easier and smarter.
    </p>
    <div>
      <button class="btn btn-primary">Contact</button>
      <button class="btn btn-outline-secondary">View Profile</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
