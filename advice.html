<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Advice Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            transition: background-image 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-container {
            max-width: 600px;
            width: 80%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .card-body {
            font-size: 1.5rem;
            padding: 2rem;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="card card-container">
        <div class="card-body" id="cardQuote">
            Loading advice...
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const images = [
            'https://plus.unsplash.com/premium_photo-1672762542894-caaa8d4f0a77?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8NGslMjBsYW5kc2NhcGV8ZW58MHx8MHx8fDA%3D',
            'https://images.unsplash.com/photo-1485470733090-0aae1788d5af?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8NGslMjBsYW5kc2NhcGV8ZW58MHx8MHx8fDA%3D',
            'https://images.unsplash.com/photo-1545641203-7d072a14e3b2?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fDRrJTIwbGFuZHNjYXBlfGVufDB8fDB8fHww',
            'https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fDRrJTIwbGFuZHNjYXBlfGVufDB8fDB8fHww',
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fDRrJTIwbGFuZHNjYXBlfGVufDB8fDB8fHww',
            'https://images.unsplash.com/photo-1537819191377-d3305ffddce4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fDRrJTIwbGFuZHNjYXBlfGVufDB8fDB8fHww'
        ];

        const cardQuote = document.getElementById('cardQuote');
        

        async function getAdvice() {
            try {
                const response = await fetch('https://api.adviceslip.com/advice');
                const data = await response.json();


                cardQuote.innerText = `"${data.slip.advice}"`;

                // Update background image
                const randomIndex = Math.floor(Math.random() * images.length);
                document.body.style.backgroundImage = `url(${images[randomIndex]})`;

            } catch (error) {
                console.error('Error fetching advice:', error);
            }
        }


        getAdvice();

        // Set interval to update every 10 seconds
        setInterval(getAdvice, 2000);
    </script>
</body>

</html>
