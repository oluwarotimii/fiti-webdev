<head>
    <title>Simple DOM Examples</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .example { margin: 15px 0; padding: 10px; border: 1px solid #ccc; }
        button { padding: 5px 10px; margin: 5px; }
        .highlight { background-color: yellow; }
    </style>
</head>
<body>
    <h1>DOM Examples</h1>
    
    <div class="example">
        <h3>Change Text Content</h3>
        <p id="text1">Original text</p>
         <button onclick="btnClick()"> Change Text </button>
   </div>
    
 <div class="example">
        <h3>Change HTML</h3>
        <div id="html1">Original HTML</div>
        <button onclick="document.getElementById('html1').innerHTML='<em>New HTML</em>'">Change HTML</button>
    </div>
    
        <div class="example">
        <h3>Change Style</h3>
        <div id="style1" style="padding: 10px; background-color: lightblue;">Styled element</div>
        <button onclick="document.getElementById('style1').style.backgroundColor='lightgreen'">Change Color</button>
    </div>
    
   <div class="example">
        <h3>Add/Remove Class</h3>
        <div id="class1">Element with class</div>
        <button onclick="document.getElementById('class1').classList.add('highlight')">Add Class</button>
        <button onclick="document.getElementById('class1').classList.remove('highlight')">Remove Class</button>
    </div>
    
    <div class="example">
        <h3>Change Attribute
        <img id="img1" src="https://i.pinimg.com/736x/dc/1a/46/dc1a466f45f29941e4ec9d96223e7d46.jpg">
        <br>
        <button onclick="imgChange()">Change Image</button>
    </div>
