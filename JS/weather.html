<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            padding: 10px;
            width: 70%;
            margin-right: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .weather-info {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f0f8ff;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <h1>Simple Weather App</h1>
    <div class="form-group">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button onclick="getWeather()">Get Weather</button>
    </div> 
    <div id="weatherResult"></div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const resultDiv = document.getElementById('weatherResult');
            
            if (!city) {
                resultDiv.innerHTML = '<div class="weather-info error">Please enter a city name</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="weather-info loading">Loading...</div>';
            
            try {
                // Using OpenWeatherMap API (you'll need a free API key)
               
                const API_KEY = 'f738f4f71aebad731e49a4220203338f'; 
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
                // https://api.openweathermap.org/data/2.5/weather?q=London&appid=f738f4f71aebad731e49a4220203338f&units=metric
                
                if (!response.ok) {
                    throw new Error('City not found');
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="weather-info">
                        <h2>${data.name}, ${data.sys.country}</h2>
                        <p><strong>Temperature:</strong> ${data.main.temp}°C</p>
                        <p><strong>Description:</strong> ${data.weather[0].description}</p>
                        <p><strong>Humidity:</strong> ${data.main.humidity}%</p>
                        <p><strong>Wind Speed:</strong> ${data.wind.speed} m/s</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="weather-info error">
                        <p>Error: ${error.message}</p>
                        <p>Note: You need to get a free API key from <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap</a> and add it to the code.</p>
                    </div>
                `;
            }
        }
        
        // Allow pressing Enter to submit
        document.getElementById('cityInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                getWeather();
            }
        });
    </script>
</body>
</html>
