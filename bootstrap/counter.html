<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Counter Example</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
    rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="./index.html">Bootstrap Examples</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h1>Counter Example with Bootstrap</h1>
        
        <!-- Counter Display -->
        <div class="card mt-4">
          <div class="card-body">
            <h2 id="count" class="display-1 text-primary">0</h2>
          </div>
        </div>
        
        <!-- Control Buttons -->
        <div class="d-grid gap-2 col-6 mx-auto mt-4">
          <button id="increase" class="btn btn-success btn-lg">
            <i class="bi bi-plus-lg"></i> Increase
          </button>
          <button id="decrease" class="btn btn-danger btn-lg">
            <i class="bi bi-dash-lg"></i> Decrease
          </button>
        </div>
        
        <!-- Reset Button -->
        <div class="mt-4">
          <button id="reset" class="btn btn-warning">
            <i class="bi bi-arrow-clockwise"></i> Reset
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (for dropdowns, modals, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Get elements
    let countDisplay = document.getElementById("count");
    let increaseBtn = document.getElementById("increase");
    let decreaseBtn = document.getElementById("decrease");
    let resetBtn = document.getElementById("reset");

    let count = 0;

    increaseBtn.addEventListener("click", () => {
      count++;
      countDisplay.innerText = count;
      updateColor();
    });

    decreaseBtn.addEventListener("click", () => {
      count--;
      countDisplay.innerText = count;
      updateColor();
    });

    resetBtn.addEventListener("click", () => {
      count = 0;
      countDisplay.innerText = count;
      updateColor();
    });

    function updateColor() {
      if (count > 0) {
        countDisplay.className = "display-1 text-success";
      } else if (count < 0) {
        countDisplay.className = "display-1 text-danger";
      } else {
        countDisplay.className = "display-1 text-primary";
      }
    }
  </script>
</body>
</html>
